name: Extension source and package checks

on:
  push:
    branches:
      - main
    paths:
      - 'sources/**'
      - 'extensions/**'
      - 'tests/**'
      - 'scripts/**'
      - 'registry*.json'
      - '.github/workflows/amazon-atmos-ci.yml'
  pull_request:
    paths:
      - 'sources/**'
      - 'extensions/**'
      - 'tests/**'
      - 'scripts/**'
      - 'registry*.json'
      - '.github/workflows/amazon-atmos-ci.yml'

permissions:
  contents: write

jobs:
  source-and-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Provider regressions
        run: node --test tests/*.test.cjs
      - name: Rebuild Amazon JP package
        run: python3 scripts/build_packages.py amazon-jp
      - name: Upload rebuilt Amazon JP package
        uses: actions/upload-artifact@v4
        with:
          name: amazon-jp-build
          path: |
            extensions/amzn-jp.sflx
            registry.json
            registry-unified.json
      - name: Validate source-backed package bytes and registry hashes
        run: python3 scripts/build_packages.py --check
      - name: Validate every registry and packaged Python module
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Commit generated Amazon JP package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extensions/amzn-jp.sflx registry.json registry-unified.json
          if git diff --cached --quiet; then
            echo "Package and registries are already current."
          else
            git commit -m "Build Amazon Music JP package"
            git push
          fi
