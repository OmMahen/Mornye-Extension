name: Build Amazon JP package

on:
  push:
    branches:
      - feature/amazon-jp-catalog
    paths:
      - 'sources/amazon-jp/**'
      - 'scripts/build_packages.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build reproducible package and update registry
        run: python3 scripts/build_packages.py amazon-jp
      - name: Verify package and registry
        run: |
          python3 scripts/build_packages.py amazon-jp --check
          python3 scripts/build_unified_registry.py --check
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run provider tests
        run: node --test tests/*.test.cjs
      - name: Run registry tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Commit generated package and registry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extensions/amzn-jp.sflx registry.json registry-unified.json
          if git diff --cached --quiet; then
            echo "Package and registries are already current."
          else
            git commit -m "Build Amazon Music JP package"
            git push
          fi
